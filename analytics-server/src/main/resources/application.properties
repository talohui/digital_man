server.port=5002
spring.config.import=optional:file:./config/runtime-secrets.properties

# H2 file 模式：数据持久化到 ./lingshan-analytics.mv.db
spring.datasource.url=jdbc:h2:file:./lingshan-analytics;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA：自动建表，不删已有数据
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 控制台（调试用：访问 http://127.0.0.1:5002/h2-console）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# 情感分析提供商：keyword（当前）| qwen（后续替换）
sentiment.provider=keyword

gorse.enabled=${GORSE_ENABLED:false}
gorse.base-url=${GORSE_BASE_URL:http://127.0.0.1:8087}
gorse.api-key=${GORSE_API_KEY:lingshan-gorse-local-key}

# NBA 大模型决策通过 Fay 内部接口生成，失败时 analytics 自动回退规则引擎。
marketing-decision.fay-base-url=${FAY_HTTP_URL:http://127.0.0.1:5000}
marketing-decision.connect-timeout-ms=1500
marketing-decision.read-timeout-ms=25000
lingshan.kb.base-url=${KB_HTTP_URL:http://127.0.0.1:5011}

# 腾讯地图 WebService 天气：Key 仅由部署环境变量提供，前端不持有也不直连。
tencent.weather.key=${TENCENT_WEATHER_KEY:}
tencent.weather.base-url=${TENCENT_WEATHER_BASE_URL:https://apis.map.qq.com/ws/weather/v1/}
tencent.weather.latitude=${LINGSHAN_WEATHER_LATITUDE:31.4268}
tencent.weather.longitude=${LINGSHAN_WEATHER_LONGITUDE:120.1008}
tencent.weather.cache-ttl-seconds=${TENCENT_WEATHER_CACHE_TTL_SECONDS:600}
analytics.config.encryption.master-key=${ANALYTICS_CONFIG_MASTER_KEY:}

# 运营日报/周报 SMTP：仅部署环境变量提供 QQ 发件账号与授权码，前端和数据库均不保存授权码。
email-report.smtp.host=${REPORT_SMTP_HOST:smtp.qq.com}
email-report.smtp.port=${REPORT_SMTP_PORT:465}
email-report.smtp.username=${REPORT_SMTP_USERNAME:}
email-report.smtp.auth-code=${REPORT_SMTP_AUTH_CODE:}
email-report.smtp.ssl=${REPORT_SMTP_SSL:true}
