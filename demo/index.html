<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b5e20" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="灵山导览" />
    <title>灵山胜境 AI 导览</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="mask-icon" href="/icon.svg" color="#1b5e20" />
    <!-- 腾讯地图域名提前握手:切到地图 tab 时省 DNS+TLS 往返 -->
    <link rel="preconnect" href="https://map.qq.com" />
    <link rel="preconnect" href="https://apis.map.qq.com" />
    <!-- Cubism 4 Core 本地化 + defer:不再同步阻塞首屏渲染,也不依赖境外 CDN。
         defer 脚本按文档序先于 module script 执行,仍保证在 React bundle 之前就绪 -->
    <script defer src="/live2d/core/live2dcubismcore.min.js"></script>
    <!-- Live2D 模型清单 + 纹理(webp) preload:与 vendor-live2d chunk 并行下载,
         砍掉「JS就绪→拉清单→拉纹理」的串行瀑布,数字人首屏更快 -->
    <link rel="preload" as="fetch" crossorigin href="/live2d/haru/haru_greeter_t03.model3.json" />
    <link rel="preload" as="image" href="/live2d/haru/haru_greeter_t03.2048/texture_00.webp" />
    <link rel="preload" as="image" href="/live2d/haru/haru_greeter_t03.2048/texture_01.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
